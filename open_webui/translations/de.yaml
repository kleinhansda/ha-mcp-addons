configuration:
  webui_url:
    name: Öffentliche URL
    description: Adresse, unter der Open WebUI erreichbar ist, ohne Pfad, z. B. https://ai.example.com. Daraus entsteht auch die OIDC-Callback-URL.
  webui_secret_key:
    name: Geheimschlüssel
    description: Nur beim Umzug nötig, wenn der alte Schlüssel als Umgebungsvariable gesetzt war. Leer = Schlüssel aus /data/.webui_secret_key (wird beim ersten Start erzeugt oder aus dem Import übernommen).
  oidc_configuration_url:
    name: OIDC-Konfigurations-URL
    description: Discovery-URL des Login-Anbieters, z. B. https://id.example.com/.well-known/openid-configuration. Leer = kein OIDC.
  oidc_provider_name:
    name: Name des Login-Anbieters
    description: Beschriftung des Login-Knopfs, z. B. Pocket ID.
  oidc_client_id:
    name: Client-ID
    description: Leer = kein OIDC, nur Login mit E-Mail und Passwort.
  oidc_client_secret:
    name: Client-Secret
  oidc_signup:
    name: Neue Konten über OIDC
    description: Legt beim ersten Login automatisch ein Konto an (mit der Standardrolle aus den Admin-Einstellungen). Aus = nur bestehende Konten.
  oidc_merge_by_email:
    name: Konten per E-Mail zusammenführen
    description: Verknüpft einen OIDC-Login mit einem bestehenden Konto gleicher E-Mail-Adresse. Nur einschalten, wenn der Anbieter E-Mail-Adressen prüft.
  login_form:
    name: Login mit E-Mail und Passwort
    description: Aus = nur noch Login über OIDC. Bleibt an, solange kein OIDC eingerichtet ist.
  searxng:
    name: Web-Suche mit SearXNG
    description: 'Startet eine private SearXNG-Instanz in der App und stellt die Web-Suche von Open WebUI bei jedem Start darauf ein. Aus = Web-Suche selbst im Admin-Bereich einrichten.'
  design:
    name: Design
    description: 'Farbschema für alle Nutzer, wirkt nach Neustart der App und Neuladen im Browser, im hellen und dunklen Modus. standard = Open WebUI unverändert; claude = Creme/Terrakotta; openai = neutrales Grau; zora = Lavendel/Nachtblau; hannesbraeu = Creme/Kohle/Hopfengrün; nord = kühles Blaugrau. Eigenes CSS in custom.css wirkt zusätzlich.'
  chat_schrift:
    name: Chat-Schrift
    description: 'Serifenschrift nur für Texte in Chat-Nachrichten, für alle Nutzer; Oberfläche und Code bleiben unverändert. Wirkt nach Neustart der App und Neuladen im Browser. standard = Schrift von Open WebUI (Inter); redaction = Redaction, kräftige Serifen; source-serif = Source Serif 4, ruhig und klar; literata = Literata, für Bildschirmlektüre; newsreader = Newsreader, zeitungsartig. Die Schriften liegen in der App, ohne externe Abrufe.'
  open_terminal_api_key:
    name: Open-Terminal-Schlüssel
    description: 'API-Schlüssel aus dem Protokoll der App „Open Terminal“. Gesetzt = Open Terminal wird automatisch als Integration eingetragen (nur für Admins). Leer = kein Open Terminal.'
  open_terminal_url:
    name: Open-Terminal-Adresse
    description: 'Nur nötig, wenn Open Terminal nicht als App aus diesem Repository läuft. Leer = http://<repo-hash>-open-terminal:8000.'
  extra_env:
    name: Weitere Umgebungsvariablen
    description: Je Eintrag NAME=Wert, z. B. CONTENT_EXTRACTION_ENGINE=tika. Variablen, die Open WebUI in der Datenbank speichert, wirken nur bis zur ersten Änderung im Admin-Bereich.
network:
  8080/tcp: Weboberfläche. Nur eintragen, wenn Open WebUI ohne Cloudflared-Add-on von außen erreichbar sein soll.
