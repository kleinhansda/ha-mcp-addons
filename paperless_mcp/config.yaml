name: Paperless MCP
version: "1.1.4"
slug: paperless_mcp
description: Paperless-ngx als Wissensquelle für LLM-Clients – Dokumente suchen, lesen, ansehen und optional verschlagworten –, mit OIDC-Login über mcp-auth-proxy
url: https://github.com/kleinhansda/ha-mcp-addons/tree/main/paperless_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - type: share
    read_only: true
ports:
  8080/tcp: null
ports_description:
  8080/tcp: MCP-Endpunkt (nur nötig ohne Cloudflared-Add-on)
# options und schema: erzeugt von .github/scripts/build_options.py aus options.yaml, nicht von Hand ändern
options:
  internal_access: false
  internal_token: ''
  paperless_url: http://ca5234a0-paperless-ngx
  paperless_token: ''
  public_ui_url: ''
  read_only: true
  public:
    external_url: ''
    oidc_configuration_url: ''
    oidc_provider_name: OIDC
    oidc_client_id: ''
    oidc_client_secret: ''
    oidc_allowed_users: ''
schema:
  internal_access: bool
  internal_token: password?
  paperless_url: match(^https?://[^\s]+$)
  paperless_token: password?
  public_ui_url: match(^(https://[^\s]+)?$)?
  read_only: bool
  public:
    external_url: match(^(https://[^/\s]+/?)?$)?
    oidc_configuration_url: match(^(https://\S+)?$)?
    oidc_provider_name: str?
    oidc_client_id: str?
    oidc_client_secret: password?
    oidc_allowed_users: str?
