name: Netlify MCP
version: "1.3.2"
slug: netlify_mcp
description: Offizieller Netlify-MCP-Server, mit OIDC-Login über mcp-auth-proxy
url: https://github.com/kleinhansda/ha-mcp-addons/tree/main/netlify_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - type: share
    read_only: true
ports:
  8080/tcp: null
ports_description:
  8080/tcp: MCP-Endpunkt (nur nötig ohne Cloudflared-Add-on)
# options und schema: erzeugt von .github/scripts/build_options.py aus options.yaml, nicht von Hand ändern
options:
  internal_access: false
  internal_token: ''
  netlify_token: null
  public:
    external_url: ''
    oidc_configuration_url: ''
    oidc_provider_name: OIDC
    oidc_client_id: ''
    oidc_client_secret: ''
    oidc_allowed_users: ''
  legacy_auth_dir: ''
schema:
  internal_access: bool
  internal_token: password?
  netlify_token: password
  public:
    external_url: match(^(https://[^/\s]+/?)?$)?
    oidc_configuration_url: match(^(https://\S+)?$)?
    oidc_provider_name: str?
    oidc_client_id: str?
    oidc_client_secret: password?
    oidc_allowed_users: str?
  legacy_auth_dir: match(^(/share/[^\s]+)?$)?
