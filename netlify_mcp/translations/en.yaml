configuration:
  internal_access:
    name: Internal access without login
    description: >-
      Additionally reachable without login in the internal Docker network, e.g. for Open WebUI on the
      same Home Assistant. Address http://<add-on-hostname>:9080/mcp (shown in the log at start). Caution:
      every app in the internal network can then use your Netlify token without login.
  netlify_token:
    name: Netlify token
    description: Personal access token with an expiry date. Applies to all sites of the account.
  public:
    name: Public access (LLM client)
    description: >-
      Only needed if an LLM client should reach the server over the internet. Leave empty for internal
      access only.
    fields:
      external_url:
        name: Public URL
        description: >-
          HTTPS address without path where an LLM client reaches the server, e.g. https://netlify-mcp.example.com.
          Empty = no public access (internal only).
      oidc_configuration_url:
        name: OIDC configuration URL
        description: >-
          Discovery URL of the login provider, e.g. https://id.example.com/.well-known/openid-configuration.
          Only needed with a public URL.
      oidc_provider_name:
        name: Login provider name
        description: Shown on the login page, e.g. Pocket ID.
      oidc_client_id:
        name: Client ID
      oidc_client_secret:
        name: Client secret
      oidc_allowed_users:
        name: Allowed users
        description: >-
          Comma-separated list (default is the email address). Empty = everyone the login provider lets
          through.
  legacy_auth_dir:
    name: Old proxy data
    description: >-
      Only when moving from a Docker stack. Folder with the data of the old mcp-auth-proxy. Copied once
      if no data exists yet.
  external_url:
    name: (old) Public URL
    description: Deprecated, enter it under “Public access (LLM client)” and clear it here.
  oidc_configuration_url:
    name: (old) OIDC configuration URL
    description: Deprecated, enter it under “Public access (LLM client)” and clear it here.
  oidc_provider_name:
    name: (old) Login provider name
    description: Deprecated, enter it under “Public access (LLM client)” and clear it here.
  oidc_client_id:
    name: (old) Client ID
    description: Deprecated, enter it under “Public access (LLM client)” and clear it here.
  oidc_client_secret:
    name: (old) Client secret
    description: Deprecated, enter it under “Public access (LLM client)” and clear it here.
  oidc_allowed_users:
    name: (old) Allowed users
    description: Deprecated, enter it under “Public access (LLM client)” and clear it here.
network:
  8080/tcp: MCP endpoint. Only needed without the Cloudflared app.
