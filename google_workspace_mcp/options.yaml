# Quelle für config.yaml (options/schema) und translations; erzeugen mit .github/scripts/build_options.py
vars:
  internal_port: 9080
  example_host: google-mcp.example.com
  internal_risk_de: je nach Rechten Mails lesen, Termine und Drive-Dateien lesen und ändern
  internal_risk_en: depending on the permissions read mail, read and change events and Drive files
entries:
- key: internal_access
- key: internal_token
- key: google_email
  default: ''
  schema: match(^([^@\s]+@[^@\s]+\.[^@\s]+)?$)?
  de:
    name: Google-Konto
    description: E-Mail-Adresse des Workspace-Kontos, mit dem sich die App anmeldet.
  en:
    name: Google account
    description: Email address of the Workspace account the app signs in with.
- key: oauth_client_id
  default: ''
  schema: str?
  de:
    name: OAuth-Client-ID
    description: Aus der Google Cloud Console, Anwendungstyp „Desktop-App“. Direkte Links zu allen Schritten im Reiter
      „Dokumentation“.
  en:
    name: OAuth client ID
    description: From the Google Cloud Console, application type "Desktop app". Direct links to every step in the
      "Documentation" tab.
- key: oauth_client_secret
  default: ''
  schema: password?
  de:
    name: OAuth-Client-Secret
    description: Gehört zur Client-ID.
  en:
    name: OAuth client secret
    description: Belongs to the client ID.
- key: auth_response
  default: ''
  schema: str?
  de:
    name: Anmelde-Antwort
    description: Nur für die einmalige Anmeldung. Den Link aus dem Log öffnen, zustimmen, dann die Adresse der nicht
      erreichbaren Seite (http://localhost/?state=…&code=…) hier einfügen und die App neu starten. Danach leeren.
  en:
    name: Sign-in response
    description: Only for the one-time sign-in. Open the link from the log, consent, then paste the address of the
      unreachable page (http://localhost/?state=…&code=…) here and restart the app. Clear it afterwards.
- key: gmail
  default: lesen
  schema: list(aus|lesen|entwuerfe)
  de:
    name: Gmail
    description: aus, lesen (suchen, Mails und Anhänge lesen) oder entwuerfe (zusätzlich Entwürfe anlegen, nicht senden).
  en:
    name: Gmail
    description: aus (off), lesen (search, read mail and attachments) or entwuerfe (additionally create drafts, no sending).
- key: calendar
  default: lesen
  schema: list(aus|lesen|schreiben)
  de:
    name: Kalender
    description: aus, lesen oder schreiben (Termine anlegen, ändern, löschen).
  en:
    name: Calendar
    description: aus (off), lesen (read) or schreiben (create, change, delete events).
- key: drive
  default: lesen
  schema: list(aus|lesen|schreiben)
  de:
    name: Drive
    description: aus, lesen (suchen, Inhalte lesen) oder schreiben (zusätzlich Dateien und Ordner anlegen, hochladen,
      ändern, freigeben).
  en:
    name: Drive
    description: aus (off), lesen (search, read content) or schreiben (additionally create, upload, change and share
      files and folders).
- key: tool_tier
  default: core
  schema: list(core|extended|complete)
  de:
    name: Werkzeugumfang
    description: core = wichtigste Werkzeuge (für Gmail lesen, Kalender und Drive schreiben 15), extended = mehr (27),
      complete = alle. Jedes Werkzeug kostet bei jeder Anfrage Tokens.
  en:
    name: Tool set
    description: core = essential tools (15 for Gmail read, Calendar and Drive write), extended = more (27), complete =
      all. Every tool costs tokens on every request.
- key: upload_dirs
  default: /share
  schema: str?
  de:
    name: Erlaubte Ordner zum Hochladen
    description: Aus diesen Ordnern darf Drive Dateien hochladen (file:///share/…), mehrere mit Doppelpunkt trennen.
  en:
    name: Allowed upload folders
    description: Drive may upload files from these folders (file:///share/…), separate several with a colon.
- key: download_dir
  default: /share/google
  schema: str?
  de:
    name: Ablage für Downloads
    description: Hier legt die App heruntergeladene Anhänge und Drive-Dateien ab.
  en:
    name: Download folder
    description: Downloaded attachments and Drive files are stored here.
- section: public
