configuration:
  internal_access:
    name: Internal access without login
    description: >-
      Additionally reachable without login in the internal Docker network, e.g. for Open WebUI on the
      same Home Assistant. Address http://<add-on-hostname>:9080/mcp (shown in the log at start). Caution:
      every app in the internal network can then depending on the permissions read mail, read and change
      events and Drive files without login.
  internal_token:
    name: Token for internal access
    description: >-
      Recommended. Set = internal access requires "Authorization: Bearer <token>"; in Open WebUI choose
      authentication "Bearer". Protects against other apps and tools in the internal network (e.g. proxy
      features of ha-mcp). Use a long random value, e.g. openssl rand -hex 32. Empty = no login as before.
  google_email:
    name: Google account
    description: Email address of the Workspace account the app signs in with.
  oauth_client_id:
    name: OAuth client ID
    description: From the Google Cloud Console, application type "Desktop app" (see documentation).
  oauth_client_secret:
    name: OAuth client secret
    description: Belongs to the client ID.
  auth_response:
    name: Sign-in response
    description: >-
      Only for the one-time sign-in. Open the link from the log, consent, then paste the address of the
      unreachable page (http://localhost/?state=…&code=…) here and restart the app. Clear it afterwards.
  gmail:
    name: Gmail
    description: >-
      aus (off), lesen (search, read mail and attachments) or entwuerfe (additionally create drafts, no
      sending).
  calendar:
    name: Calendar
    description: aus (off), lesen (read) or schreiben (create, change, delete events).
  drive:
    name: Drive
    description: >-
      aus (off), lesen (search, read content) or schreiben (additionally create, upload, change and share
      files and folders).
  tool_tier:
    name: Tool set
    description: >-
      core = essential tools (15 for Gmail read, Calendar and Drive write), extended = more (27), complete
      = all. Every tool costs tokens on every request.
  upload_dirs:
    name: Allowed upload folders
    description: Drive may upload files from these folders (file:///share/…), separate several with a
      colon.
  download_dir:
    name: Download folder
    description: Downloaded attachments and Drive files are stored here.
  public:
    name: Public access (LLM client)
    description: >-
      Only needed if an LLM client should reach the server over the internet. Leave empty for internal
      access only.
    fields:
      external_url:
        name: Public URL
        description: >-
          HTTPS address without path where an LLM client reaches the server, e.g. https://google-mcp.example.com.
          Empty = no public access (internal only).
      oidc_configuration_url:
        name: OIDC configuration URL
        description: >-
          Discovery URL of the login provider, e.g. https://id.example.com/.well-known/openid-configuration.
          Only needed with a public URL.
      oidc_provider_name:
        name: Login provider name
        description: Shown on the login page, e.g. Pocket ID.
      oidc_client_id:
        name: Client ID
      oidc_client_secret:
        name: Client secret
      oidc_allowed_users:
        name: Allowed users
        description: >-
          Comma-separated list (default is the email address). Empty = everyone the login provider lets
          through.
