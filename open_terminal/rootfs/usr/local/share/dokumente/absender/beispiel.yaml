# Muster für den eigenen Absender von `dokument`. Einmal kopieren und anpassen:
#   mkdir -p ~/dokumente/absender && cp -n /usr/local/share/dokumente/absender/beispiel.yaml ~/dokumente/absender/ich.yaml
# (Administratoren: /share/dokumente/absender/ich.yaml). ich.yaml gilt für Briefe und Anschreiben;
# weitere Absender als <name>.yaml, Aufruf mit --absender <name>.
absender:
  name: Max Mustermann
  strasse: Musterstraße 12
  ort: 60326 Frankfurt am Main
  telefon: 069 123456
  mail: max@example.de
  # web: example.de
  # ansprechpartner: Max Mustermann     # erscheint im Infoblock (nur Art brief)
  # fusszeile:                          # Spalten der Fußzeile, je Spalte Zeilen
  #   - [Max Mustermann, Musterstraße 12, 60326 Frankfurt am Main]
  #   - [IBAN DE00 0000 0000 0000 0000 00]
# unterschrift: [Max Mustermann]
# unterschrift-bild: unterschrift.png            # relativ zum Dokument oder absoluter Pfad
