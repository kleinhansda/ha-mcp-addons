title: Dokument
author: Open Terminal
version: 1.0.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    common:
      lang: de
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - page.typ
      papersize: a4
      section-numbering: null
    docx:
      reference-doc: referenz-persoenlich.docx
      filters:
        - stil.lua
        - brief.lua
    html:
      minimal: true
      embed-resources: true
      filters:
        - stil.lua
        - brief.lua
