configuration:
  api_key:
    name: API key
    description: >-
      Empty = generated on first start, stored in /data and shown in the log at every start. Enter the
      same value in the Open WebUI app as open_terminal_api_key.
  work_dir:
    name: Work folder
    description: >-
      Folder under /share, available in the terminal as ~/work (with mbox/ and openwebui/ as exchange
      folders). Same folder as ArtCraft and Foto MCP. Empty = no link.
  writable_dirs:
    name: Additional writable folders
    description: >-
      Folders relative to /share the terminal may write to (permissions via ACL, also for files created
      later), e.g. hannesbraeu. Only needed if the work folder is /share; otherwise the whole work folder
      is writable. The folder is created if missing.
  python_bundles:
    name: Python package groups
    description: >-
      Installed with uv into ~/.venv (Python in the terminal uses them automatically). bild = Pillow,
      HEIF, OpenCV, scikit-image, rawpy; vektor = drawsvg, svgwrite, CairoSVG, ReportLab, fonttools, QR
      and barcodes; pdf = pypdf, pikepdf, PyMuPDF, pdfplumber; office = python-docx, docxtpl, python-pptx,
      openpyxl, XlsxWriter; cad = ezdxf, shapely, matplotlib; 3d = trimesh, numpy-stl, manifold3d, build123d
      (CAD, STEP).
  python_packages:
    name: Additional Python packages
    description: One package per entry, as for pip, e.g. rembg or pandas==2.2.3 (with version = pinned).
  update_packages:
    name: Update packages at every start
    description: >-
      Fetches the newest versions at start (Python via uv, R from CRAN). Runs in the background, the terminal
      is available immediately. The previous state is saved to ~/.venv/staende/ first; to go back: uv
      pip sync --python ~/.venv/bin/python ~/.venv/staende/<date>.txt. Off = only install what is missing.
  r_packages:
    name: Additional R packages (CRAN)
    description: >-
      In addition to tidyverse and the bundled packages, e.g. officer, flextable, magick, svglite. Installed
      into ~/R/library. Note: they are compiled from source, so the first start can take long.
  multi_user:
    name: Multi-user
    description: >-
      Every Open WebUI user gets an own account with an own folder (kept across updates, others cannot
      enter). Non-administrators only see the family folder of /share. Not a hard boundary: all share
      CPU, process list and network.
  admin_users:
    name: Administrators (Open WebUI user IDs)
    description: >-
      Open WebUI user IDs (e.g. user_id in a model export) that keep full access in multi-user mode: /share,
      work folder, writable folders, previous home.
  family_dir:
    name: Family folder
    description: Folder relative to /share that everyone may read and write in multi-user mode. Empty
      = none.
  webdav:
    name: WebDAV (administrators only)
    description: >-
      Access to a WebDAV storage (e.g. Nextcloud) for rclone in the terminal. Only set up in multi-user
      mode and only readable for administrators. Empty URL = off.
    fields:
      name:
        name: Name
        description: Name of the remote in rclone, e.g. nextcloud → rclone ls nextcloud:Documents
      url:
        name: URL
        description: >-
          WebDAV URL, for Nextcloud https://<server>/remote.php/dav/files/<user>/ (shown in Nextcloud
          under Files → Settings → WebDAV).
      user:
        name: User name
      password:
        name: Password
        description: Preferably an app password (Nextcloud → Settings → Security), revocable at any time.
      vendor:
        name: Vendor
network:
  8000/tcp: API. Only needed if Open WebUI runs on another device; set your own key in that case.
