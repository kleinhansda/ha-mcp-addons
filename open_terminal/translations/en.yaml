configuration:
  api_key:
    name: API key
    description: Empty = generated on first start, stored in /data and shown in the log on every start. Enter the same value as open_terminal_api_key in the Open WebUI app.
  work_dir:
    name: Work folder
    description: Folder under /share, available as ~/work in the terminal (with inbox/ and out/). Same folder as ArtCraft and Foto MCP. Empty = no link.
  github_token:
    name: GitHub token
    description: Optional. Fine-grained PAT, limited to the repos needed, Contents and Pull requests (read/write), with an expiry date. Available in the terminal as GH_TOKEN (git push over HTTPS, gh). Any command in the terminal can read it. Empty = no GitHub access.
network:
  8000/tcp: API. Only needed if Open WebUI runs on another device; set your own key in that case.
