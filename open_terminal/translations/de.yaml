configuration:
  api_key:
    name: API-Schlüssel
    description: >-
      Leer = wird beim ersten Start erzeugt, in /data gespeichert und bei jedem Start im Protokoll angezeigt.
      Denselben Wert in der App Open WebUI als open_terminal_api_key eintragen.
  work_dir:
    name: Arbeitsordner
    description: >-
      Ordner unter /share, im Terminal als ~/work (mit mbox/ und openwebui/ als Austauschordnern). Gleicher
      Ordner wie bei ArtCraft und Foto MCP. Leer = kein Link.
  writable_dirs:
    name: Zusätzlich beschreibbare Ordner
    description: >-
      Ordner relativ zu /share, in die das Terminal schreiben darf (Rechte per ACL, auch für später angelegte
      Dateien), z. B. hannesbraeu. Nur nötig, wenn der Arbeitsordner /share ist; sonst ist der ganze Arbeitsordner
      beschreibbar. Der Ordner wird angelegt, falls er fehlt.
  python_bundles:
    name: Python-Paketgruppen
    description: >-
      Werden per uv in ~/.venv installiert (Python im Terminal nutzt sie automatisch). bild = Pillow,
      HEIF, OpenCV, scikit-image, rawpy; vektor = drawsvg, svgwrite, CairoSVG, ReportLab, fonttools, QR-
      und Barcodes; pdf = pypdf, pikepdf, PyMuPDF, pdfplumber; office = python-docx, docxtpl, python-pptx,
      openpyxl, XlsxWriter; cad = ezdxf, shapely, matplotlib; 3d = trimesh, numpy-stl, manifold3d, build123d
      (CAD, STEP).
  python_packages:
    name: Weitere Python-Pakete
    description: Je Eintrag ein Paket, wie bei pip, z. B. rembg oder pandas==2.2.3 (mit Version = festgehalten).
  update_packages:
    name: Pakete bei jedem Start aktualisieren
    description: >-
      Holt beim Start die neuesten Versionen (Python per uv, R aus CRAN). Läuft im Hintergrund, das Terminal
      ist sofort da. Vorher wird der Stand nach ~/.venv/staende/ gesichert, zum Zurückgehen: uv pip sync
      --python ~/.venv/bin/python ~/.venv/staende/<Datum>.txt. Aus = nur Fehlendes installieren.
  r_packages:
    name: Weitere R-Pakete (CRAN)
    description: >-
      Zusätzlich zu tidyverse und den mitgelieferten Paketen, z. B. officer, flextable, magick, svglite.
      Landen in ~/R/library. Achtung: sie werden aus den Quellen kompiliert, der erste Start kann dann
      lange dauern.
  multi_user:
    name: Mehrbenutzer
    description: >-
      Jeder Open-WebUI-Nutzer bekommt ein eigenes Konto mit eigenem Ordner (bleibt bei Updates erhalten,
      andere kommen nicht hinein). Nicht-Administratoren sehen von /share nur ihren Arbeitsbereich und
      gemeinsam/ im Familienordner, auch über die Datei-Werkzeuge. Kein harter Schutz: alle teilen sich
      Rechner, Prozessliste und Netz.
  admin_users:
    name: Administratoren (Open-WebUI-Nutzer-IDs)
    description: >-
      Nutzer-IDs aus Open WebUI (z. B. im Export eines Modells als user_id), die im Mehrbenutzer-Modus
      vollen Zugriff wie bisher haben: /share, Arbeitsordner, beschreibbare Ordner, bisheriges Home.
  family_dir:
    name: Familienordner
    description: >-
      Ordner relativ zu /share für Nicht-Administratoren im Mehrbenutzer-Modus: darin je Konto ein privater
      Arbeitsbereich (dokumente, inbox, work; im Terminal als ~/dokumente usw.) und gemeinsam/ für alle.
      Leer = keiner.
  quota_gb:
    name: Speicher je Konto (GB)
    description: >-
      Höchstgröße von Home und Arbeitsbereich je Nicht-Administrator. Darüber nimmt das Terminal nach
      spätestens einer Minute keine neuen Dateien mehr an, bis Platz frei ist. 0 = unbegrenzt.
  webdav:
    name: WebDAV (nur Administratoren)
    description: >-
      Zugang zu einem WebDAV-Speicher (z. B. Nextcloud) für rclone im Terminal. Wird nur im Mehrbenutzer-Modus
      eingerichtet und ist nur für Administratoren lesbar. Leere Adresse = aus.
    fields:
      name:
        name: Name
        description: Name des Ziels in rclone, z. B. nextcloud → rclone ls nextcloud:Dokumente
      url:
        name: Adresse
        description: >-
          WebDAV-Adresse, bei Nextcloud https://<server>/remote.php/dav/files/<nutzer>/ (steht in Nextcloud
          unter Dateien → Einstellungen → WebDAV).
      user:
        name: Benutzername
      password:
        name: Passwort
        description: Am besten ein App-Passwort (Nextcloud → Einstellungen → Sicherheit), jederzeit widerrufbar.
      vendor:
        name: Anbieter
  mailbox_drive:
    name: mailbox.org Drive (nur Administratoren)
    description: >-
      mailbox.org Drive als zweites WebDAV-Ziel für rclone im Terminal. Wie WebDAV nur im Mehrbenutzer-Modus
      und nur für Administratoren lesbar. Leere E-Mail-Adresse = aus.
    fields:
      name:
        name: Name
        description: Name des Ziels in rclone, z. B. mbox → rclone lsd mbox:Userstore
      user:
        name: E-Mail-Adresse
      password:
        name: Passwort
        description: >-
          mailbox.org-Anwendungspasswort vom Typ „WebDAV-Client“ (Einstellungen → Sicherheit), jederzeit
          widerrufbar.
  gdrive:
    name: Google Drive (nur Administratoren)
    description: >-
      Eine geteilte Ablage in Google Drive als rclone-Ziel im Terminal, über einen Service-Account mit
      Zugriff nur auf diese Ablage. Wird nur im Mehrbenutzer-Modus eingerichtet und ist nur für Administratoren
      lesbar. Leere ID = aus.
    fields:
      name:
        name: Name
        description: Name des Ziels in rclone, z. B. hbdrive → rclone lsd hbdrive:Marketing
      shared_drive_id:
        name: ID der geteilten Ablage
        description: >-
          Steht in der Adresse, wenn die geteilte Ablage im Browser offen ist: drive.google.com/drive/folders/<ID>.
      service_account:
        name: Service-Account-Schlüssel (JSON)
        description: >-
          Inhalt der JSON-Schlüsseldatei des Service-Accounts. Den Service-Account (client_email) in der
          geteilten Ablage als Mitglied mit der Rolle „Mitbearbeiter“ hinzufügen.
network:
  8000/tcp: >-
    API. Nur eintragen, wenn Open WebUI auf einem anderen Gerät läuft; dann unbedingt einen eigenen Schlüssel
    setzen.
