name: Open Terminal
version: "0.14.7-2"
slug: open_terminal
description: Open Terminal (Shell, Dateien und Werkzeuge für Modelle in Open WebUI) in einem eigenen Container
url: https://github.com/kleinhansda/ha-mcp-addons/tree/main/open_terminal
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - type: share
    read_only: false
ports:
  8000/tcp: null
ports_description:
  8000/tcp: API (nur nötig, wenn Open WebUI nicht auf diesem Gerät läuft)
backup_exclude:
  - home/.cache
  - home/.npm
options:
  api_key: ""
  work_dir: /share/artcraft/work
schema:
  api_key: password?
  work_dir: "match(^(/share/[^\\s]+)?$)"
