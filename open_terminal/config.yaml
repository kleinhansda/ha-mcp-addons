name: Open Terminal
version: "0.17.7"
slug: open_terminal
description: Open Terminal (Shell, Dateien und Werkzeuge für Modelle in Open WebUI) in einem eigenen Container
url: https://github.com/kleinhansda/ha-mcp-addons/tree/main/open_terminal
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - type: share
    read_only: false
ports:
  8000/tcp: null
ports_description:
  8000/tcp: API (nur nötig, wenn Open WebUI nicht auf diesem Gerät läuft)
backup_exclude:
  - home/.cache
  - home/.npm
# options und schema: erzeugt von .github/scripts/build_options.py aus options.yaml, nicht von Hand ändern
options:
  api_key: ''
  work_dir: /share/artcraft/work
  writable_dirs: []
  python_bundles:
  - bild
  - vektor
  - pdf
  - office
  - cad
  python_packages: []
  update_packages: true
  r_packages: []
  multi_user: false
  admin_users: []
  family_dir: familie
schema:
  api_key: password?
  work_dir: match(^(/share(/[^\s]+)?)?$)?
  writable_dirs:
  - match(^[^/\s.][^\s]*$)?
  python_bundles:
  - list(bild|vektor|pdf|office|cad|3d)?
  python_packages:
  - str?
  update_packages: bool
  r_packages:
  - str?
  multi_user: bool
  admin_users:
  - match(^[A-Za-z0-9-]{4,}$)?
  family_dir: match(^([^/\s.][^\s]*)?$)?
