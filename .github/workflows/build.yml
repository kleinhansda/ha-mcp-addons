# Baut jedes Add-on für beide Architekturen und führt den Selbsttest aus.
name: Build und Selbsttest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gemeinsame Dateien gleich?
        run: python3 .github/scripts/sync_common.py --check
      - name: Python-Pins von Foto MCP vollständig?
        run: python3 .github/scripts/foto_lock.py --check

  build:
    needs: common
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [artcraft_mcp, foto_mcp, github_mcp, netlify_mcp]
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
            wait: 10
          - arch: aarch64
            platform: linux/arm64
            wait: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sperrdatei erzeugen, falls sie fehlt (nur für diesen Build)
        if: matrix.addon == 'netlify_mcp'
        run: |
          if [ ! -f netlify_mcp/package-lock.json ]; then
            echo "::warning::netlify_mcp/package-lock.json fehlt, update.yml ausführen"
            cd netlify_mcp && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Bauen (${{ matrix.addon }}, ${{ matrix.arch }})
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci \
            -t test:${{ matrix.addon }} ${{ matrix.addon }}
      - name: Selbsttest (${{ matrix.addon }}, ${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e SELFTEST_WAIT=${{ matrix.wait }} \
            test:${{ matrix.addon }} mcp-selftest

  # Open WebUI und Open Terminal sind keine MCP-Server und haben keinen mcp-selftest.
  # Getestet wird der echte Start mit Healthcheck, SearXNG, die Verbindung zu Open
  # Terminal und die Datenübernahme, auf beiden Architekturen mit nativen Runnern
  # (arm64: in der App wird SearXNG mit pip installiert, das muss auch dort klappen).
  open_webui:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Platz schaffen (zwei große Images)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Bauen
        run: |
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci -t test:open_webui open_webui
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci -t test:open_terminal open_terminal
      - name: Start, SearXNG, Open Terminal und Übernahme testen
        run: bash .github/scripts/test_open_webui.sh test:open_webui test:open_terminal
