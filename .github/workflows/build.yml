# Baut jedes Add-on für beide Architekturen und führt den Selbsttest aus.
name: Build und Selbsttest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gemeinsame Dateien gleich?
        run: python3 .github/scripts/sync_common.py --check
      - name: Optionen aus dem Gerüst erzeugt?
        run: python3 .github/scripts/build_options.py --check
      - name: Python-Pins von Foto MCP vollständig?
        run: python3 .github/scripts/foto_lock.py --check
      - name: Aufräumen des Arbeitsordners (Pyscript)
        run: python3 -I .github/scripts/test_work_cleanup.py homeassistant/pyscript/work_cleanup.py
      - name: Files MCP – Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil python3-pypdf python3-mutagen poppler-utils
          /usr/bin/python3 files_mcp/tests/test_files_mcp.py common/files_mcp.py
      - name: Brücke (Token, Nachsicht bei Argumenten)
        run: python3 .github/scripts/test_mcp_bridge.py common/mcp_bridge.py
      - name: Paperless MCP – Werkzeuge gegen nachgebaute API
        run: python3 paperless_mcp/tests/test_paperless_mcp.py paperless_mcp/rootfs/usr/local/lib/mcp/paperless_mcp.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mailbox.org MCP – Passkey-Gate
        run: bash mailbox_org_mcp/tests/gate/run.sh
      - name: mailbox.org MCP – Drive (WebDAV)
        run: bash mailbox_org_mcp/tests/webdav/run.sh

  build:
    needs: common
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [artcraft_mcp, files_mcp, foto_mcp, github_mcp, google_workspace_mcp, mailchimp_mcp, netlify_mcp, paperless_mcp]
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
            wait: 10
          - arch: aarch64
            platform: linux/arm64
            wait: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sperrdatei erzeugen, falls sie fehlt (nur für diesen Build)
        if: matrix.addon == 'netlify_mcp'
        run: |
          if [ ! -f netlify_mcp/package-lock.json ]; then
            echo "::warning::netlify_mcp/package-lock.json fehlt, update.yml ausführen"
            cd netlify_mcp && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Bauen (${{ matrix.addon }}, ${{ matrix.arch }})
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci \
            -t test:${{ matrix.addon }} ${{ matrix.addon }}
      - name: Selbsttest (${{ matrix.addon }}, ${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e SELFTEST_WAIT=${{ matrix.wait }} \
            test:${{ matrix.addon }} mcp-selftest
      - name: Anmeldung im Image (google_workspace_mcp, ${{ matrix.arch }})
        if: matrix.addon == 'google_workspace_mcp'
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/google_workspace_mcp/tests:/t:ro" \
            test:google_workspace_mcp /opt/venv/bin/python /t/test_gws_auth.py /usr/local/lib/mcp/gws_auth.py
      - name: Umfänge im Image (mailchimp_mcp, ${{ matrix.arch }})
        if: matrix.addon == 'mailchimp_mcp'
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/mailchimp_mcp/tests:/t:ro" \
            test:mailchimp_mcp python3 /t/test_scope.py
      - name: Werkzeugtests im Image (files_mcp, ${{ matrix.arch }})
        if: matrix.addon == 'files_mcp'
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/files_mcp/tests:/t:ro" \
            test:files_mcp python3 /t/test_files_mcp.py /usr/local/lib/mcp/files_mcp.py

  # mailbox.org MCP startet mcp-hub über run.mjs statt run.sh, daher kein mcp-selftest.
  # Geprüft werden Build, python3 für die Brücke und die erzeugte Hub-Konfiguration.
  mailbox_org_mcp:
    needs: common
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Bauen (${{ matrix.arch }})
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci \
            -t test:mailbox_org_mcp mailbox_org_mcp
      - name: Konfiguration und Brücke (${{ matrix.arch }})
        run: |
          cat > /tmp/opts.json <<'EOF'
          {"email":"ci@example.org","app_password":"x","hub_password":"x","external_url":"https://mbox.example.org",
           "timezone":"Europe/Berlin","essential_tools":true,"mail_enabled":true,"mail_write":false,
           "smtp_enabled":true,"smtp_allow_send":false,"calendar_enabled":true,"calendar_write":false,
           "contacts_enabled":true,"contacts_write":false,"drive_enabled":true,"drive_write":false,
           "webdav_password":"x","work_dir":"","passkey_enabled":false,"internal_access":true}
          EOF
          docker run --rm --platform ${{ matrix.platform }} -v /tmp/opts.json:/opts.json:ro -e OPTIONS_PATH=/opts.json \
            --entrypoint node test:mailbox_org_mcp /app/run.mjs --dry-run 2>log.txt | tee hub.json
          cat log.txt
          for s in mail smtp calendar contacts drive; do jq -e ".mcpServers.$s" hub.json >/dev/null; done
          test "$(grep -c 'intern ohne Login' log.txt)" = 5
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 test:mailbox_org_mcp \
            -c "import ast; ast.parse(open('/app/mcp_bridge.py').read())"
          for b in imap-mcp smtp-mcp caldav-mcp carddav-mcp; do
            docker run --rm --platform ${{ matrix.platform }} --entrypoint sh test:mailbox_org_mcp -c "command -v $b"
          done

  # Open WebUI und Open Terminal sind keine MCP-Server und haben keinen mcp-selftest.
  # Getestet wird der echte Start mit Healthcheck, SearXNG, die Verbindung zu Open
  # Terminal und die Datenübernahme, auf beiden Architekturen mit nativen Runnern
  # (arm64: in der App wird SearXNG mit pip installiert, das muss auch dort klappen).
  open_webui:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Platz schaffen (zwei große Images)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - name: Bauen
        run: |
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci -t test:open_webui open_webui
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci -t test:open_terminal open_terminal
      - name: Start, SearXNG, Open Terminal und Übernahme testen
        run: bash .github/scripts/test_open_webui.sh test:open_webui test:open_terminal
      - name: Open Terminal Mehrbenutzer testen
        run: bash .github/scripts/test_open_terminal_multi.sh test:open_terminal

  # Spliit: echter Start mit eingebautem PostgreSQL, Weboberfläche, Sicherung nach /backup,
  # sauberes Stoppen und zweiter Start auf denselben Daten. Native Runner für beide Architekturen.
  spliit:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bauen (${{ matrix.arch }})
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t test:spliit spliit
      - name: Start, Weboberfläche, Sicherung, Neustart (${{ matrix.arch }})
        run: |
          mkdir -p /tmp/sp/data /tmp/sp/backup
          echo '{"backup_days": 7, "ha_events": true}' > /tmp/sp/data/options.json
          start() {
            docker run -d --name sp -p 3000:3000 -v /tmp/sp/data:/data -v /tmp/sp/backup:/backup test:spliit
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              case "$code" in 200|307|308) echo "Weboberfläche antwortet ($code) nach ${i}x2 s"; return 0 ;; esac
              sleep 2
            done
            docker logs sp; return 1
          }
          start
          curl -fsSL http://127.0.0.1:3000/groups/create -o /dev/null
          docker exec sp psql -U spliit -h 127.0.0.1 -d spliit -Atc 'SELECT count(*) FROM "Group"'
          sleep 3
          ls -l /tmp/sp/backup
          ls /tmp/sp/backup/spliit-*.sql
          docker logs sp 2>&1 | tee log1.txt
          grep -q "Keine Ereignisse an Home Assistant" log1.txt   # ohne SUPERVISOR_TOKEN aus
          docker stop -t 30 sp
          test "$(docker inspect -f '{{.State.ExitCode}}' sp)" = 0
          docker rm sp
          start
          docker logs sp 2>&1 | tee log2.txt
          ! grep -q "Neue Datenbank" log2.txt
          docker rm -f sp

  # Vorlagen aus Open Terminal: laufen mit den Paketen ihrer Gruppe durch (nativ, beide Architekturen)
  vorlagen:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 3d/teil.py (build123d)
        run: |
          uv venv -p 3.12 /tmp/v
          grep -v '^#' open_terminal/rootfs/etc/open-terminal/pakete/3d.txt | uv pip install --python /tmp/v/bin/python -r -
          cd "$RUNNER_TEMP"
          VORLAGE_AUS=out /tmp/v/bin/python "$GITHUB_WORKSPACE/open_terminal/rootfs/usr/local/share/vorlagen/3d/teil.py" | tee log.txt
          grep -q "geschlossen: True" log.txt
          for f in halter.step halter.stl halter_vorne.svg halter_oben.svg halter_rechts.svg halter_iso.svg; do test -s "out/$f"; done
