name: GitHub MCP
version: "1.2.3"
slug: github_mcp
description: Offizieller GitHub-MCP-Server, mit OIDC-Login über mcp-auth-proxy
url: https://github.com/kleinhansda/ha-addons/tree/main/github_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - type: share
    read_only: true
ports:
  8080/tcp: null
ports_description:
  8080/tcp: MCP-Endpunkt (nur nötig ohne Cloudflared-Add-on)
# options und schema: erzeugt von .github/scripts/build_options.py aus options.yaml, nicht von Hand ändern
options:
  internal_access: false
  github_token: null
  toolsets: default
  read_only: false
  gh_host: ''
  public:
    external_url: ''
    oidc_configuration_url: ''
    oidc_provider_name: OIDC
    oidc_client_id: ''
    oidc_client_secret: ''
    oidc_allowed_users: ''
  legacy_auth_dir: ''
schema:
  internal_access: bool
  github_token: password
  toolsets: match(^[a-z_,]*$)
  read_only: bool
  gh_host: str
  public:
    external_url: match(^(https://[^/\s]+/?)?$)?
    oidc_configuration_url: match(^(https://\S+)?$)?
    oidc_provider_name: str?
    oidc_client_id: str?
    oidc_client_secret: password?
    oidc_allowed_users: str?
  legacy_auth_dir: match(^(/share/[^\s]+)?$)?
