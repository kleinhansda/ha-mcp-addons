configuration:
  internal_access:
    name: Internal access without login
    description: 'Additionally reachable without login in the internal Docker network, e.g. for Open WebUI on the same Home Assistant. Address http://<add-on-hostname>:9080/mcp (shown in the log at start).
      Caution: every app in the internal network can then use your GitHub token without login.'
  github_token:
    name: GitHub token
    description: Fine-grained personal access token. Its permissions decide what the server may do.
  toolsets:
    name: Toolsets
    description: Comma-separated, no spaces, e.g. default, all or default,actions,gists. Empty = server default.
  read_only:
    name: Read only
    description: Disable write tools.
  gh_host:
    name: GitHub host
    description: Only for GitHub Enterprise, otherwise leave empty.
  public:
    name: Public access (Claude app)
    description: Only needed if Claude should reach the server over the internet. Leave empty for internal access only.
    fields:
      external_url:
        name: Public URL
        description: HTTPS address without a path where Claude reaches the server, e.g. https://mcp.example.com. Empty = no public access (internal only).
      oidc_configuration_url:
        name: OIDC configuration URL
        description: Discovery URL of the identity provider, e.g. https://id.example.com/.well-known/openid-configuration. Only needed with a public URL.
      oidc_provider_name:
        name: Identity provider name
        description: Shown on the login page, e.g. Pocket ID.
      oidc_client_id:
        name: Client ID
      oidc_client_secret:
        name: Client secret
      oidc_allowed_users:
        name: Allowed users
        description: Comma-separated list (email by default). Empty = everyone the identity provider lets through.
  legacy_auth_dir:
    name: Old proxy data
    description: Only when moving from a Docker stack. Folder with the data of the old mcp-auth-proxy. Copied once if no data exists yet.
  external_url:
    name: (old) Public URL
    description: Deprecated, enter it under “Public access” and clear it here.
  oidc_configuration_url:
    name: (old) OIDC configuration URL
    description: Deprecated, enter it under “Public access” and clear it here.
  oidc_provider_name:
    name: (old) Identity provider name
    description: Deprecated, enter it under “Public access” and clear it here.
  oidc_client_id:
    name: (old) Client ID
    description: Deprecated, enter it under “Public access” and clear it here.
  oidc_client_secret:
    name: (old) Client secret
    description: Deprecated, enter it under “Public access” and clear it here.
  oidc_allowed_users:
    name: (old) Allowed users
    description: Deprecated, enter it under “Public access” and clear it here.
network:
  8080/tcp: MCP endpoint. Only needed without the Cloudflared app.
