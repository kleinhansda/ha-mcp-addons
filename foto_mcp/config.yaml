name: Foto MCP
version: "1.0.1"
slug: foto_mcp
description: Fotos sichten, begradigen, zuschneiden und retuschieren (OpenCV, MediaPipe) als MCP-Server für Claude, mit OIDC-Login über mcp-auth-proxy
url: https://github.com/kleinhansda/ha-mcp-addons/tree/main/foto_mcp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
map:
  - type: share
    read_only: false
ports:
  8080/tcp: null
ports_description:
  8080/tcp: MCP-Endpunkt (nur nötig ohne Cloudflared-Add-on)
options:
  oidc_configuration_url: null
  oidc_provider_name: OIDC
  oidc_client_id: null
  oidc_client_secret: null
  oidc_allowed_users: ""
  external_url: null
  work_dir: /share/artcraft/work
schema:
  oidc_configuration_url: url
  oidc_provider_name: str
  oidc_client_id: str
  oidc_client_secret: password
  oidc_allowed_users: str
  external_url: "match(^https://[^/\\s]+/?$)"
  work_dir: "match(^/share/[^\\s]+$)"
