configuration:
  backup_days:
    name: Tägliche Datenbank-Sicherung (Tage)
    description: >-
      Schreibt täglich einen SQL-Dump nach /backup/spliit-<Datum>.sql und behält so viele Tage. 0 = keine
      eigene Sicherung (die Daten sind trotzdem in den normalen Home-Assistant-Backups).
  ha_events:
    name: Ereignisse an Home Assistant
    description: >-
      Meldet neue Aktivitäten (Ausgabe angelegt, geändert, gelöscht …) alle 30 Sekunden als Ereignis spliit_activity,
      z. B. für Benachrichtigungen per Automation.
network:
  3000/tcp: Weboberfläche. Nur eintragen, wenn Spliit ohne Cloudflared-Add-on erreichbar sein soll.
