configuration:
  internal_access:
    name: Internal access without login
    description: >-
      Additionally reachable without login in the internal Docker network, e.g. for Open WebUI on the
      same Home Assistant. Address http://<add-on-hostname>:9080/mcp (shown in the log at start). Caution:
      every app in the internal network can then read audiences, contacts, campaigns and reports (depending
      on the scope also create drafts or send) without login.
  internal_token:
    name: Token for internal access
    description: >-
      Recommended. Set = internal access requires "Authorization: Bearer <token>"; in Open WebUI choose
      authentication "Bearer". Protects against other apps and tools in the internal network (e.g. proxy
      features of ha-mcp). Use a long random value, e.g. openssl rand -hex 32. Empty = no login as before.
  api_key:
    name: API key
    description: >-
      In Mailchimp, profile → Extras → API keys. Format <key>-<datacenter>, e.g. ...-us21; the datacenter
      is part of the key.
  scope:
    name: Scope
    description: >-
      lesen = about 20 lookup tools, writes blocked. entwuerfe = additionally create campaign drafts,
      set content, copy and send test emails; no sending or deleting. alle = all ~230 tools including
      send, schedule and delete (too many for small models).
  extra_tools:
    name: Additional tools
    description: >-
      Optional, comma-separated tool names on top of the scope, e.g. schedule_campaign,tag_member. Write
      tools only work if the scope is not "lesen".
  dry_run:
    name: Dry run
    description: Write tools only show what they would do and do not call Mailchimp.
  public:
    name: Public access (LLM client)
    description: >-
      Only needed if an LLM client should reach the server over the internet. Leave empty for internal
      access only.
    fields:
      external_url:
        name: Public URL
        description: >-
          HTTPS address without path where an LLM client reaches the server, e.g. https://mailchimp-mcp.example.com.
          Empty = no public access (internal only).
      oidc_configuration_url:
        name: OIDC configuration URL
        description: >-
          Discovery URL of the login provider, e.g. https://id.example.com/.well-known/openid-configuration.
          Only needed with a public URL.
      oidc_provider_name:
        name: Login provider name
        description: Shown on the login page, e.g. Pocket ID.
      oidc_client_id:
        name: Client ID
      oidc_client_secret:
        name: Client secret
      oidc_allowed_users:
        name: Allowed users
        description: >-
          Comma-separated list (default is the email address). Empty = everyone the login provider lets
          through.
